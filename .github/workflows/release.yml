name: Release

# Runs when a version tag is pushed: the whole quality gate again, then the
# release itself. See CONTRIBUTING.md for how to cut one.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: AF2B/borba-tooling/.github/workflows/clojure-lib.yml@d088e5daeae9ff381bcd9891e835196f5bb93cce # v0.1.3
    with:
      postgres: false
      redis: false
      kafka: false

  release:
    name: Release
    needs: verify
    uses: AF2B/borba-tooling/.github/workflows/clojure-lib-release.yml@d088e5daeae9ff381bcd9891e835196f5bb93cce # v0.1.3
    permissions:
      contents: write
      id-token: write
      attestations: write
